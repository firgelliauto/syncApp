# Paid web service with persistent SQLite. Start paused until bootstrap is reviewed.
services:
  - type: web
    name: firgelli-inventory-sync
    runtime: node
    plan: starter
    autoDeployTrigger: off
    buildCommand: node --version
    startCommand: node src/server.mjs
    healthCheckPath: /health
    disk:
      name: inventory-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MAIN_SHOP
        value: firgelliautomation.myshopify.com
      - key: CHILD_SHOP
        value: firgelli1.myshopify.com
      - key: MAIN_LOCATION_ID
        value: gid://shopify/Location/439267
      - key: CHILD_LOCATION_ID
        value: gid://shopify/Location/62239080646
      - key: MAIN_CLIENT_ID
        sync: false
      - key: MAIN_CLIENT_SECRET
        sync: false
      - key: CHILD_CLIENT_ID
        sync: false
      - key: CHILD_CLIENT_SECRET
        sync: false
      - key: STATE_DB
        value: /var/data/inventory-sync.sqlite
      - key: SYNC_ENABLED
        value: "false"
      - key: ALLOW_INVENTORY_WRITES
        value: "false"
